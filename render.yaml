services:
  - type: web
    name: campus-pulse
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: SEED_DEMO
        value: "false"
      - key: ENABLE_DEMO
        value: "false"
      - key: CLEANUP_ASSISTANT_SAMPLES
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@campuspulse.local
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: campus-pulse-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
databases:
  - name: campus-pulse-db
    plan: free
    region: singapore
    databaseName: campus_pulse
    user: campus_pulse
    ipAllowList: []
